<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Book a time</title>
<link rel="icon" href="/favicon.ico">
<style>
:root { color-scheme: light dark; --bg:#f5f5f7; --panel:#fff; --ink:#1d1d1f; --ink-3:#6e6e73; --line:#d2d2d7; --well:#f0f0f3; --accent:#2C46C4; --err:#b3261e;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg:#000; --panel:#1c1c1e; --ink:#f5f5f7; --ink-3:#a1a1a6; --line:#3a3a3c; --well:#2c2c2e; --err:#ff8a80; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
main { max-width: 640px; margin: 0 auto; padding: 28px 16px 60px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
h2.title { font-size: 26px; letter-spacing: -.02em; margin: 0 0 4px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h2 { font-size: 17px; margin: 22px 0 10px; }
.muted { color: var(--ink-3); }
.days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x mandatory; }
.days button { flex: none; width: 74px; padding: 10px 0; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; cursor: pointer; scroll-snap-align: start; }
.days button small { display: block; color: var(--ink-3); font-size: 12px; }
.days button b { font-size: 20px; }
.days button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.days button[aria-pressed="true"] small { color: rgba(255,255,255,.85); }
.days button:disabled { opacity: .35; cursor: default; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.slots button { padding: 11px 0; border-radius: 12px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font: inherit; font-weight: 650; cursor: pointer; }
.slots button[aria-pressed="true"] { background: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { .slots button { color: #fff; border-color: color-mix(in srgb, var(--accent) 70%, #fff); } }
label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 5px; }
input, textarea { width: 100%; font: inherit; padding: 11px 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
textarea { min-height: 80px; resize: vertical; }
.btn { display: inline-block; margin-top: 18px; padding: 13px 24px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font: inherit; font-weight: 650; cursor: pointer; text-decoration: none; }
.btn.secondary { background: var(--well); color: var(--ink); }
.btn:disabled { opacity: .6; }
.err { color: var(--err); font-weight: 600; }
.hp { position: absolute; left: -9999px; }
.fine { font-size: 13px; color: var(--ink-3); }
.done { text-align: center; padding: 30px 10px; }
.done .check { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; margin: 0 auto 14px; font-size: 28px; }
.dayhead { display: flex; justify-content: space-between; align-items: center; }
.btn.nav { margin: 0; padding: 8px 14px; }
footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--ink-3); }
footer a { color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 2px; }
</style>
</head>
<body>
<main><h1 class="vh">Book a time</h1><div class="card" id="box"><p class="muted">Loading…</p></div>
<footer>Booking by <a href="https://knightwebstudio.com/">KWS Hub</a></footer></main>
<script>
(function () {
  var FN = "https://uhmyfoibrwdkdhrnnaah.supabase.co/functions/v1/hub";
  var p = new URLSearchParams(location.search), box = document.getElementById("box");
  var A = p.get("a"), C = p.get("c") || "estimate", M = p.get("m");
  var info = null, tz = "America/Chicago", picked = null, manage = null;
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function get(q) { return fetch(FN + "?" + q).then(function (r) { return r.json(); }); }
  function post(b) { return fetch(FN, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(b) }).then(function (r) { return r.json(); }); }
  function today() { return new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }
  function addDays(d, n) { var x = d.split("-").map(Number); return new Date(Date.UTC(x[0], x[1] - 1, x[2] + n)).toISOString().slice(0, 10); }
  function dayLabel(d, opt) { var x = d.split("-").map(Number); return new Intl.DateTimeFormat("en-US", Object.assign({ timeZone: "UTC" }, opt)).format(new Date(Date.UTC(x[0], x[1] - 1, x[2]))); }
  function time(iso) { return new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "numeric", minute: "2-digit" }).format(new Date(iso)); }
  function fail(m) { box.innerHTML = '<p class="err">' + esc(m || "Something went wrong. Please call us instead.") + "</p>"; }
  function accent(c) { if (c) document.documentElement.style.setProperty("--accent", c); }

  var slotsByDay = {}, from = null;
  function loadSlots(start, then) {
    get("op=slots&a=" + encodeURIComponent(A) + "&c=" + encodeURIComponent(C) + "&date=" + start + "&days=14").then(function (d) {
      if (d.error) return fail(d.error);
      slotsByDay = d.slots || {}; from = start; then();
    }).catch(function () { fail(); });
  }
  function picker(title, onPick) {
    var days = []; for (var i = 0; i < 14; i++) days.push(addDays(from, i));
    var first = days.filter(function (d) { return slotsByDay[d]; })[0];
    box.innerHTML = title + '<h2>Pick a day</h2><div class="days" role="group" aria-label="Days">' + days.map(function (d) {
      return '<button type="button" data-d="' + d + '"' + (slotsByDay[d] ? "" : " disabled") + ' aria-pressed="' + (d === first) + '"><small>' + dayLabel(d, { weekday: "short" }) + "</small><b>" + dayLabel(d, { day: "numeric" }) + "</b><small>" + dayLabel(d, { month: "short" }) + "</small></button>";
    }).join("") + '</div><div class="dayhead"><h2 id="dh"></h2><span><button type="button" class="btn secondary nav" id="prev" aria-label="Earlier days">‹</button> <button type="button" class="btn secondary nav" id="next" aria-label="Later days">›</button></span></div><div class="slots" id="slots"></div>';
    function show(d) {
      Array.prototype.forEach.call(box.querySelectorAll("[data-d]"), function (b) { b.setAttribute("aria-pressed", b.dataset.d === d); });
      document.getElementById("dh").textContent = d ? dayLabel(d, { weekday: "long", month: "long", day: "numeric" }) : "No open times in these two weeks";
      var s = document.getElementById("slots");
      s.innerHTML = (slotsByDay[d] || []).map(function (iso) { return '<button type="button" data-t="' + iso + '">' + time(iso) + "</button>"; }).join("");
      Array.prototype.forEach.call(s.querySelectorAll("[data-t]"), function (b) { b.addEventListener("click", function () { onPick(b.dataset.t); }); });
    }
    Array.prototype.forEach.call(box.querySelectorAll("[data-d]"), function (b) { b.addEventListener("click", function () { show(b.dataset.d); }); });
    document.getElementById("prev").disabled = from <= today();
    document.getElementById("prev").onclick = function () { loadSlots(addDays(from, -14) < today() ? today() : addDays(from, -14), function () { picker(title, onPick); }); };
    document.getElementById("next").onclick = function () { loadSlots(addDays(from, 14), function () { picker(title, onPick); }); };
    show(first);
  }

  function bookForm(iso) {
    picked = iso;
    box.innerHTML = '<p class="muted"><a href="#" id="chg">‹ Change time</a></p><h2 class=title>' + esc(info.calendar.name) + '</h2><p><b>' +
      esc(new Intl.DateTimeFormat("en-US", { timeZone: tz, weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit" }).format(new Date(iso))) + "</b> · " + info.calendar.duration + " minutes</p>" +
      '<form id="bf" novalidate><label for="n">Your name</label><input id="n" name="name" autocomplete="name" required>' +
      '<label for="ph">Mobile phone</label><input id="ph" name="phone" type="tel" autocomplete="tel">' +
      '<label for="em">Email</label><input id="em" name="email" type="email" autocomplete="email">' +
      '<label for="nt">What do you need? <span class="muted">(optional)</span></label><textarea id="nt" name="notes"></textarea>' +
      '<div class="hp" aria-hidden="true"><input name="website_url" tabindex="-1" autocomplete="off"></div>' +
      '<p class="fine">We\'ll text or email your confirmation and a reminder. Reply STOP to opt out of texts.</p>' +
      '<button class="btn">Confirm booking</button><p class="err" id="er" role="alert"></p></form>';
    document.getElementById("chg").onclick = function (e) { e.preventDefault(); start(); };
    document.getElementById("bf").addEventListener("submit", function (e) {
      e.preventDefault();
      var f = e.target, er = document.getElementById("er");
      if (!f.name.value.trim()) { er.textContent = "Please add your name."; return; }
      if (!f.phone.value.trim() && !f.email.value.trim()) { er.textContent = "Please add a phone number or email."; return; }
      f.querySelector("button").disabled = true; er.textContent = "";
      post({ op: "book", a: A, c: C, start: picked, name: f.name.value, phone: f.phone.value, email: f.email.value, notes: f.notes.value, website_url: f.website_url.value })
        .then(function (d) {
          if (d.error) { er.textContent = d.error; f.querySelector("button").disabled = false; if (/taken/.test(d.error)) setTimeout(start, 1500); return; }
          box.innerHTML = '<div class="done"><div class="check" aria-hidden="true">✓</div><h2 class=title>You\'re booked</h2><p><b>' + esc(d.when) + "</b><br>with " + esc(info.business) +
            '</p><p class="muted">A confirmation is on its way. Need to change it? <a href="' + esc(d.manage) + '">Reschedule or cancel</a></p></div>';
        }).catch(function () { f.querySelector("button").disabled = false; er.textContent = "That didn't go through. Please try again."; });
    });
  }

  function start() {
    var title = "<h2 class=title>" + esc(info.business) + "</h2><p class=\"muted\">" + esc(info.calendar.name) + " · " + info.calendar.duration + " minutes" +
      (info.calendar.location ? " · " + esc(info.calendar.location) : "") + "</p>" + (info.calendar.description ? "<p>" + esc(info.calendar.description) + "</p>" : "");
    loadSlots(today(), function () { picker(title, bookForm); });
  }

  function manageView() {
    if (manage.status !== "booked") { box.innerHTML = "<h2 class=title>" + esc(manage.business) + "</h2><p>This appointment was cancelled.</p>" + (manage.account ? '<a class="btn" href="?a=' + encodeURIComponent(manage.account) + "&c=" + encodeURIComponent(manage.calendar.slug) + '">Book a new time</a>' : ""); return; }
    box.innerHTML = "<h2 class=title>" + esc(manage.business) + "</h2><p>" + esc(manage.calendar.name) + "<br><b>" + esc(manage.when) + '</b></p><button class="btn" id="rs">Pick a new time</button> <button class="btn secondary" id="cx">Cancel appointment</button><p class="err" id="er" role="alert"></p>';
    document.getElementById("cx").onclick = function () {
      if (!confirm("Cancel this appointment?")) return;
      post({ op: "cancel", m: M }).then(function (d) { if (d.error) return fail(d.error); manage.status = "cancelled"; manageView(); });
    };
    document.getElementById("rs").onclick = function () {
      A = manage.account; C = manage.calendar.slug;
      loadSlots(today(), function () {
        picker("<h2 class=title>Pick a new time</h2><p class=\"muted\">Now: " + esc(manage.when) + "</p>", function (iso) {
          post({ op: "reschedule", m: M, start: iso }).then(function (d) {
            if (d.error) return alert(d.error);
            box.innerHTML = '<div class="done"><div class="check" aria-hidden="true">✓</div><h2 class=title>Moved</h2><p><b>' + esc(d.when) + "</b></p><p class=\"muted\">We've sent you the new time.</p></div>";
          });
        });
      });
    };
  }

  if (M) {
    get("op=manage&m=" + encodeURIComponent(M)).then(function (d) {
      if (d.error) return fail(d.error);
      manage = d; tz = d.calendar.timezone || tz; accent(d.color); document.title = "Your appointment with " + d.business; manageView();
    }).catch(function () { fail(); });
  } else if (A) {
    get("op=calendar&a=" + encodeURIComponent(A) + "&c=" + encodeURIComponent(C)).then(function (d) {
      if (d.error) return fail(d.error);
      info = d; tz = d.timezone || tz; accent(d.color); document.title = "Book with " + d.business; start();
    }).catch(function () { fail(); });
  } else fail("This booking link is missing the business name.");
})();
</script>
</body>
</html>
